<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Talabat October 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: one long reading column per brand; sticky brand switch; summary → when → who → where → how → money → actions */
:root{
  --paper:#F3F5F1; --surface:#FFFFFF; --sunk:#E9EDE7; --ink:#17201E; --muted:#58645F; --line:#D9DFD8;
  --fba:#0E5A53; --fba-2:#A8761F; --jb:#B4461A; --jb-2:#3B3530;
  --good:#1E7A4B; --bad:#B42318; --warn:#A86A0C;
  --accent:var(--fba); --accent-2:var(--fba-2);
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1513; --surface:#161E1C; --sunk:#1C2624; --ink:#E6ECE8; --muted:#9BA8A2; --line:#2A3633;
  --fba:#52B5A8; --fba-2:#D9A84E; --jb:#EE8047; --jb-2:#D8CFC6;
  --good:#4CC38A; --bad:#F2766A; --warn:#E8B24E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1513; --surface:#161E1C; --sunk:#1C2624; --ink:#E6ECE8; --muted:#9BA8A2; --line:#2A3633;
  --fba:#52B5A8; --fba-2:#D9A84E; --jb:#EE8047; --jb-2:#D8CFC6;
  --good:#4CC38A; --bad:#F2766A; --warn:#E8B24E; color-scheme:dark}
body[data-brand="jb"]{--accent:var(--jb); --accent-2:var(--jb-2)}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1160px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.45rem,1.1rem + 1.2vw,1.9rem);line-height:1.3}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.lede{color:var(--muted);max-width:68ch}

/* sticky switch */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.src{font-size:.82rem;color:var(--muted)}
.switch{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.switch button{font:inherit;font-weight:600;font-size:.95rem;border:0;background:transparent;color:var(--muted);padding:7px 18px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s}
.switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch button[data-b="fba"][aria-pressed="true"]{color:var(--fba)}
.switch button[data-b="jb"][aria-pressed="true"]{color:var(--jb)}

/* hero */
.hero{padding-block:40px 28px;display:grid;gap:22px}
.brandname{font-family:var(--f-display);font-weight:700;font-size:clamp(2.3rem,1.6rem + 3vw,3.8rem);line-height:1.15;color:var(--accent)}
.tag{color:var(--accent-2);font-family:var(--f-display);font-size:1.1rem}
.period{color:var(--muted);font-size:.95rem}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:18px 20px;display:grid;gap:4px;align-content:start}
.kpi .l{color:var(--muted);font-size:.85rem}
.kpi .v{font-size:clamp(1.5rem,1.1rem + 1.3vw,2.2rem);font-weight:700;line-height:1.2}
.kpi .v small{font-size:.5em;font-weight:500;color:var(--muted);margin-inline-start:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:600;padding:1px 9px;border-radius:999px;width:max-content}
.up{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.flat{color:var(--muted);background:var(--sunk)}
.kpi .s{font-size:.8rem;color:var(--muted)}
.verdict{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.verdict div{padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.95rem}
.verdict b{display:block;font-size:.85rem;margin-bottom:2px}
.verdict .g b{color:var(--good)} .verdict .w b{color:var(--warn)} .verdict .r b{color:var(--bad)}

section{padding-block:36px;border-top:1px solid var(--line);display:grid;gap:18px}
.head{display:grid;gap:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.grid2b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.chartbox{position:relative;height:300px}
.chartbox.sm{height:220px}
.note{font-size:.85rem;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:860px}
th,td{padding:11px 12px;text-align:start;white-space:nowrap}
thead th{font-weight:600;color:var(--muted);font-size:.8rem;border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0}
th button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center}
th button[aria-sort]::after{content:"▾";font-size:.75rem;color:var(--accent)}
th button[aria-sort="ascending"]::after{content:"▴"}
tbody tr{border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--sunk)}
tbody tr.sel{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
td.name{font-weight:600}
.barcell{display:flex;align-items:center;gap:8px}
.minibar{height:6px;border-radius:3px;background:var(--accent);min-width:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px}
.pill.g{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.pill.w{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.r{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}

/* branch detail */
.detail{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:var(--r);background:var(--surface);padding:20px;display:grid;gap:18px}
.detail .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.detail .bn{font-family:var(--f-display);font-size:1.6rem;color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.fact{background:var(--sunk);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.fact .l{font-size:.75rem;color:var(--muted)}
.fact .v{font-weight:700;font-size:1.1rem}
.tips{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tips li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.95rem}
.tips li svg{margin-top:5px;flex:none}

/* heatmap */
.heat{display:grid;grid-template-columns:64px repeat(17,minmax(0,1fr));gap:3px;direction:rtl;font-size:.72rem}
.heat .h{color:var(--muted);text-align:center}
.heat .d{color:var(--muted);align-self:center}
.heat .c{aspect-ratio:1/1;border-radius:4px;background:var(--sunk);position:relative}
.heat .c:hover{outline:2px solid var(--ink)}
.heatwrap{overflow-x:auto}
.heatinner{min-width:560px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.8rem;padding:6px 10px;border-radius:8px;z-index:20;opacity:0;transition:opacity .1s}

/* funnel */
.funnel{display:grid;gap:10px}
.fstep{display:grid;grid-template-columns:120px 1fr 90px;gap:12px;align-items:center}
.ftrack{height:34px;background:var(--sunk);border-radius:8px;overflow:hidden}
.ffill{height:100%;background:var(--accent);border-radius:8px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.fstep .lab{font-size:.9rem}
.fstep .val{font-weight:700;text-align:end}
.fdrop{font-size:.8rem;color:var(--muted);padding-inline-start:132px}

/* money */
.money{display:flex;height:46px;border-radius:10px;overflow:hidden;font-size:.8rem;font-weight:600}
.money div{display:flex;align-items:center;justify-content:center;color:#fff;white-space:nowrap;overflow:hidden;padding-inline:6px}
.mlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mlist div{display:grid;gap:2px}
.mlist .l{font-size:.85rem;color:var(--muted)}
.mlist .v{font-weight:700;font-size:1.25rem}

/* callout */
.alert{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px 18px;border-radius:var(--r);background:color-mix(in srgb,var(--bad) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 30%,var(--line))}
.alert h3{color:var(--bad)}

/* actions */
.actions{display:grid;gap:12px;counter-reset:a}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.act .n{font-family:var(--f-display);font-size:1.5rem;color:var(--accent);line-height:1;min-width:1.4em}
.act h3{margin-bottom:4px}
.act p{color:var(--muted);font-size:.93rem;max-width:72ch}
.act .imp{text-align:end;display:grid;gap:2px;min-width:110px}
.act .imp b{font-size:1.1rem;color:var(--good)}
.act .imp span{font-size:.75rem;color:var(--muted)}
.pri{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;margin-inline-start:8px;vertical-align:middle}
.pri.h{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pri.m{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pri.l{background:var(--sunk);color:var(--muted)}

/* simulator */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:center}
.ctrl{display:grid;gap:16px}
.ctrl label{display:grid;gap:6px;font-size:.92rem}
.ctrl .row{display:flex;justify-content:space-between;gap:8px}
.ctrl output{font-weight:700;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.simout{display:grid;gap:12px;text-align:center;background:var(--sunk);border-radius:var(--r);padding:22px}
.simout .big{font-size:clamp(1.8rem,1.2rem + 2vw,2.6rem);font-weight:700;color:var(--good)}
.simout .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.88rem;color:var(--muted)}
.simout .row2 b{display:block;color:var(--ink);font-size:1.1rem}

footer{padding-top:28px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;display:grid;gap:6px}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid2b,.sim{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .verdict{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .act{grid-template-columns:auto 1fr}
  .act .imp{grid-column:2;text-align:start}
  .fstep{grid-template-columns:86px 1fr 70px;gap:8px}
  .fdrop{padding-inline-start:94px}
  .mlist{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .switch button{padding:7px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .45s cubic-bezier(.16,1,.3,1)}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

<style>
:root{--store:#8A6A1E;--jahez:#6B4FA0;--ahlan:#3B7DB8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--store:#D9AE52;--jahez:#A98BE0;--ahlan:#73AEE6}}
:root[data-theme="dark"]{--store:#D9AE52;--jahez:#A98BE0;--ahlan:#73AEE6}
.switch button[data-b="all"][aria-pressed="true"]{color:var(--ink)}
body[data-brand="all"]{--accent:var(--ink);--accent-2:var(--muted)}
.split{display:flex;height:34px;border-radius:10px;overflow:hidden;font-size:.82rem;font-weight:600}
.split span{display:flex;align-items:center;justify-content:center;color:#fff;white-space:nowrap;overflow:hidden;padding-inline:8px}
.findings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.finding{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.95rem}
.finding .tg{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tg.g{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.tg.w{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.tg.r{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:3px}
.seg button{font:inherit;font-size:.85rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rankrow{display:grid;grid-template-columns:190px minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:.9rem}
.rankrow .tr{height:16px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.rankrow .tr span{height:100%}
.rankrow .v{text-align:end;font-weight:600}
.ranks{display:grid;gap:8px}
.lgd{display:flex;gap:16px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.shead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
@media (max-width:900px){.findings{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.rankrow{grid-template-columns:120px minmax(0,1fr) 64px;font-size:.82rem}}
</style>

  const br=B.branches, names=br.map(b=>b.name.split(" / ")[0]);
  mk("cNew",{type:"bar",data:{labels:names,datasets:[

    {label:"جدد",data:br.map(b=>b.newC),backgroundColor:css("--accent-2"),borderRadius:4,stack:"s"}]},

  const awt=br.map(b=>b.awtRate);

function drawHeat(B){
  const hrs=[...Array(17)].map((_,i)=>i+6), max=Math.max(...B.heat.flat());
  let h=`<div class="heat"><span></span>${hrs.map(x=>`<span class="h num">${x}</span>`).join("")}`;
  B.heat.forEach((row,i)=>{h+=`<span class="d">${WD[i]}</span>`+hrs.map(x=>{const v=row[x]; const a=v?Math.round(12+88*v/max):0;
    return `<span class="c" data-t="${WD[i]} الساعة ${x}:00 · ${v} طلب" style="background:${v?`color-mix(in srgb,var(--accent) ${a}%,var(--sunk))`:"var(--sunk)"}"></span>`}).join("")});
  document.getElementById("heat").innerHTML=h+"</div>";
}
const tip=document.getElementById("tip");
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".heat .c"); if(c){tip.textContent=c.dataset.t; tip.style.opacity=1; tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+"px"; tip.style.top=(e.clientY+14)+"px";} else tip.style.opacity=0;});

const COLS=[["name","الفرع"],["rev","المبيعات"],["share","الحصة"],["ord","الطلبات"],["aov","قيمة الطلب"],["conv","تحويل القائمة"],["awtRate","انتظار السائق"],["prep","التحضير"],["contact","الشكاوى"],["rating","التقييم"]];
function val(b,k,tot){if(k==="share")return b.rev/tot; if(k==="conv")return b.buyers/b.explorers*100; return b[k];}
function drawTable(){
  const T=DATA.brands[brand].T;
  const br=[...DATA.brands[brand].branches].sort((a,b)=>{const x=val(a,sortKey,T.rev),y=val(b,sortKey,T.rev); return (typeof x==="string"?x.localeCompare(y,"ar"):x-y)*sortDir;});
  const mx=Math.max(...br.map(b=>b.rev)), t=document.getElementById("tbl");
  t.innerHTML=`<thead><tr>${COLS.map(([k,l])=>`<th scope="col"><button type="button" data-k="${k}" ${k===sortKey?`aria-sort="${sortDir>0?"ascending":"descending"}"`:""}>${l}</button></th>`).join("")}</tr></thead>
  <tbody>${br.map(b=>{const cv=b.buyers/b.explorers*100;
    const aw=b.awtRate>=60?"r":b.awtRate>=50?"w":"g", pr=b.prep>=720?"r":b.prep>=600?"w":"g", rt=b.rating<4?"r":b.rating<4.4?"w":"g", ct=b.contact>=0.7?"r":b.contact>=0.4?"w":"g";
    return `<tr data-id="${b.id}" tabindex="0" class="${b.id===selected?"sel":""}">

      <td><span class="pill ${aw} num">${fmt(b.awtRate,0)}%</span></td><td><span class="pill ${pr} num">${fmt(b.prep/60,1)} د</span></td><td><span class="pill ${ct} num">${fmt(b.contact,2)}%</span></td><td><span class="pill ${rt} num">${fmt(b.rating,1)}</span></td></tr>`}).join("")}</tbody>`;
  t.querySelectorAll("th button").forEach(btn=>btn.onclick=()=>{const k=btn.dataset.k; if(k===sortKey) sortDir*=-1; else {sortKey=k; sortDir=k==="name"?1:-1;} drawTable();});

function branchTips(b,T){
  const out=[], cv=b.buyers/b.explorers*100, avgCv=T.buyers/T.explorers*100, ns=b.newC/(b.newC+b.retC)*100, avgNs=T.newC/(T.newC+T.retC)*100;
  if(b.offline>100000) out.push(["warn",`كان مغلقاً على طلبات 14 يوماً (7–20 أكتوبر). عند أي إغلاق: حوّل الطلبات لأقرب فرع أو جدول الإغلاق مسبقاً في البوابة بدل التوقف المفاجئ.`]);
  else if(b.offline>18000) out.push(["warn",`توقف عن استقبال الطلبات ${N(fmt(b.offline/3600,1))} ساعة خلال الشهر. راجع الأسباب (جهاز، إنترنت، إيقاف يدوي وقت الذروة).`]);
  if(b.awtRate>=60) out.push(["warn",`انتظار السائق مرتفع جداً (${N(fmt(b.awtRate,0)+"%")}). اضغط «جاهز» فقط عندما يكون الطلب مغلّفاً فعلاً، وابدأ التحضير لحظة القبول.`]);
  else if(b.awtRate>=50) out.push(["warn",`نصف الطلبات تقريباً فيها انتظار للسائق (${N(fmt(b.awtRate,0)+"%")}). تجهيز مسبق للأصناف الأكثر طلباً قبل الذروة يقلّص هذا.`]);
  else out.push(["ok",`انتظار السائق أقل من بقية الفروع (${N(fmt(b.awtRate,0)+"%")}). طريقة عمل هذا الفرع تصلح نموذجاً للآخرين.`]);
  if(b.prep>=720) out.push(["warn",`وقت التحضير ${N(fmt(b.prep/60,1))} دقيقة، أطول من متوسط العلامة (${N(fmt(T.prep/60,1))}). راجع ترتيب المحطة وعدد الموظفين في ساعات الفطور.`]);
  if(cv<avgCv-2) out.push(["warn",`التحويل من القائمة ${N(fmt(cv,1)+"%")} أقل من المتوسط (${N(fmt(avgCv,1)+"%")}). صور أوضح، الأصناف الأكثر مبيعاً في الأعلى، وتأكد أن كل الأصناف متوفرة.`]);
  else if(cv>avgCv+2) out.push(["ok",`من يفتح القائمة هنا يطلب أكثر من غيره (${N(fmt(cv,1)+"%")}). الإعلان أو العروض لجلب زوار أكثر ستعطي هنا أعلى عائد.`]);
  if(b.contact>=0.7) out.push(["warn",`نسبة الشكاوى ${N(fmt(b.contact,2)+"%")} من الطلبات، من الأعلى بين الفروع. اقرأ الشكاوى في البوابة وعالج السبب المتكرر.`]);
  if(b.rating<4) out.push(["warn",`التقييم ${N(fmt(b.rating,1))} من 5 وهو الأدنى. اقرأ آخر التعليقات، عالج السبب المتكرر، وردّ على المراجعات السلبية.`]);
  if(b.ded>=3) out.push(["warn",`${N(b.ded)} طلبات خُصم منها بسبب شكوى (${Object.entries(b.dedReasons).map(([k,v])=>`${RN[k]||k} ×${v}`).join("، ")}). قائمة فحص قبل إغلاق الكيس تحل أغلبها.`]);
  if(ns>avgNs+8) out.push(["ok",`${N(fmt(ns,0)+"%")} من طلباته من زبائن جدد، أعلى من متوسط العلامة (${N(fmt(avgNs,0)+"%")}). اعرف ما الذي يجذبهم هنا وكرّره في الفروع الأخرى.`]);
  if(b.items<1.4) out.push(["warn",`${N(fmt(b.items,2))} صنف لكل طلب. أضف خيار «اجعلها وجبة» ومشروباً مقترحاً عند كل ساندويتش.`]);
  return out;
}

function drawFunnel(T){
  const st=[["شاهدوا المطعم",T.visitors],["فتحوا القائمة",T.explorers],["وصلوا للسلة",T.carts],["طلبوا",T.buyers]];
  const why=["يفتحون القائمة. هنا أكبر فاقد: الصورة الرئيسية والعروض وترتيبك في القائمة تحدد هذه النسبة.","يضيفون شيئاً للسلة. القائمة نفسها (الصور، الأسعار، الوصف) تحدد هذه النسبة.","يكملون الطلب. نسبة جيدة، والفاقد هنا غالباً بسبب رسوم أو وقت التوصيل."];
  let h=""; st.forEach(([l,v],i)=>{
    const w=i===0?100:Math.max(1.5,Math.sqrt(v/T.visitors)*100);
    h+=`<div class="fstep"><span class="lab">${l}</span><div class="ftrack"><div class="ffill" style="width:${w}%"></div></div><span class="val num">${fmt(v)}</span></div>`;
    if(i<3) h+=`<div class="fdrop">↓ ${N(fmt(st[i+1][1]/v*100,1)+"%")} ${why[i]}</div>`;
  });
  document.getElementById("funnel").innerHTML=h+`<p class="note">الأشرطة على مقياس الجذر التربيعي حتى تظهر المراحل الصغيرة. التحويل الكلي ${N(fmt(T.buyers/T.visitors*100,2)+"%")}.</p>`;
}

function bindSim(B,T){

    document.getElementById("oConv").textContent=c.value+"%"; document.getElementById("oAov").textContent=fmt(av,3)+" د.ب"; document.getElementById("oDays").textContent=dd;
    const newRev=T.ord*(1+cv)*(aov+av)+lostPerDay*dd, add=newRev-T.rev;
    document.getElementById("simBig").innerHTML=`${N("+"+fmt(add))} د.ب`;
    document.getElementById("simTot").innerHTML=`${N(fmt(newRev))} د.ب`;
    document.getElementById("simNet").innerHTML=`${N("+"+fmt(add*net))} د.ب`;};
  [c,a,d].forEach(x=>x.oninput=up); up();
}

    <td>${P(b.awtRate>=60?"r":b.awtRate>=50?"w":"g",fmt(b.awtRate,0)+"%")}</td>
    <td>${P(b.prep>=720?"r":b.prep>=600?"w":"g",fmt(b.prep/60,1)+" د")}</td>
    <td>${P(b.contact>=0.7?"r":b.contact>=0.4?"w":"g",fmt(b.contact,2)+"%")}</td>
    <td>${P(b.ready>=98?"g":b.ready<=95.5?"r":"w",fmt(b.ready,1)+"%")}</td>
    <td class="num">${fmt(v(b,"ret"),0)}%</td>
    <td>${P(b.rating<4?"r":b.rating<4.4?"w":"g",fmt(b.rating,1))}</td></tr>`}).join("")}</tbody>`;
  t.querySelectorAll("th button").forEach(btn=>btn.onclick=()=>{const k=btn.dataset.k; if(k===opsKey) opsDir*=-1; else {opsKey=k; opsDir=k==="name"?1:-1;} drawOps();});
}

document.querySelectorAll(".switch button").forEach(b=>b.onclick=()=>{if(brand===b.dataset.b)return; brand=b.dataset.b; selected=null; sortKey="rev"; sortDir=-1; try{localStorage.setItem("tal-view",brand)}catch(e){} render(); window.scrollTo({top:0,behavior:"auto"});});
let lastDark=null;
const rerender=()=>{const dk=getComputedStyle(document.body).getPropertyValue("--paper"); if(dk!==lastDark){lastDark=dk; render();}};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",rerender);
new MutationObserver(rerender).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
lastDark=getComputedStyle(document.body).getPropertyValue("--paper"); render();
</script>
</body></html>
